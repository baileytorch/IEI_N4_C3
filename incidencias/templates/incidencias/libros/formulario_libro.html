{% extends 'base.html' %}

{% block title %}Crear Libro{% endblock %}

{% block content %}
<h3>Agregar Libro</h3>
<br>

<div class="row">
    <form action="" method="post">
        {% csrf_token %}

        <div class="row">
            <div class="col-8">
                <label for="id_titulo" class="form-label">Título:</label>
                {{ form.titulo }}
            </div>

            <div class="col-4">
                <label for="id_paginas" class="form-label">Cantidad de Páginas:</label>
                {{ form.paginas }}
            </div>
        </div>
        <br>

        <div class="row">
            <div class="col">
                <label for="id_autor" class="form-label">Autor:</label>
                {{ form.autor }}
            </div>

            <div class="col">
                <label for="id_subgenero" class="form-label">Género:</label>
                {{ form.subgenero }}
            </div>

            <div class="col">
                <label for="id_biblioteca" class="form-label">Biblioteca:</label>
                {{ form.biblioteca }}
            </div>
        </div>
        <br>

        <div class="row">
            <div class="col d-flex justify-content-end gap-2">
                <button type="reset" class="btn btn-secondary">Cancelar</button>
                <button type="submit" class="btn btn-primary">Guardar</button>
            </div>
        </div>
    </form>
</div>

{% endblock %}

</script>
{% endblock %}
