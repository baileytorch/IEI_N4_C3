{% load static %}

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}BiblioHub | Gestión de Biblioteca{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'css/bootstrap.css' %}">

    <script src="{% static 'js/bootstrap.bundle.js' %}"></script>

    <link rel="shortcut icon" href="{% static 'images/bibliohub.png' %}" type="image/x-icon">

</head>

<body>

    <!-- =========================
         NAVBAR
    ========================= -->

    <header class="navbar">

        <div class="brand">

            <div class="brand-icon">
                📚
            </div>

            <span>BiblioHub</span>

        </div>


        <nav class="nav-links">

            <a href="#">Inicio</a>
            <a href="#">Catálogo</a>
            <a href="#">Usuarios</a>
            <a href="#">Préstamos</a>

        </nav>

    </header>

    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

</body>

</html>
