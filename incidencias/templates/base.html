{% load static %}

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}BiblioHub | Gestión de Biblioteca{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'css/darkly.css' %}">
    <link rel="stylesheet" href="{% static 'css/datatables.css' %}">

    <script src="{% static 'js/bootstrap.bundle.js' %}"></script>
    <script src="{% static 'js/jquery_v4.0.0.js' %}"></script>
    <script src="{% static 'js/datatables.js' %}"></script>

    <link rel="shortcut icon" href="{% static 'images/bibliohub.png' %}" type="image/x-icon">

</head>

<body>

    <!-- =========================
         NAVBAR
    ========================= -->

    <nav class="navbar navbar-expand-lg bg-primary" data-bs-theme="light">

        <div class="col">

            <div class="brand-icon">
                📚
            </div>

            <span>BiblioHub</span>

        </div>


        <div class="nav-links">

            <a href="#">Inicio</a>
            <a href="#">Catálogo</a>
            <a href="#">Usuarios</a>
            <a href="#">Préstamos</a>

        </div>

    </nav>

    <div class="container">
        <br>
        {% block content %}
        {% endblock %}
    </div>

</body>

{% block scripts_pie %}
{% endblock %}

</html>
